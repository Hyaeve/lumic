services:
  lumic:
    image: ghcr.io/hyaeve/lumic:latest
    container_name: lumic
    ports:
      - "15500:5500"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      LUMIC_USERNAME: ${LUMIC_USERNAME:-Lumic}
      LUMIC_PASSWORD: ${LUMIC_PASSWORD:-Lumic}
      LUMIC_COOKIE_SECURE: ${LUMIC_COOKIE_SECURE:-false}
    restart: unless-stopped
