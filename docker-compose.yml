services:
  lumic:
    image: ghcr.io/hyaeve/lumic:latest
    container_name: lumic
    ports:
      - "15500:5500"
    volumes:
      # 配置、密钥、账号凭证、数据库和同步游标。
      - ./data:/data
      # 平台动态、图文、专栏正文及媒体文件。
      - ./flow:/flow
      # 浏览动态时按需生成的压缩预览图，可独立清理和挂载。
      - ./previews:/previews
    environment:
      TZ: Asia/Shanghai
      LUMIC_PREVIEW_ROOT: /previews
    restart: unless-stopped
